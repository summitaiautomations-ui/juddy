<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond Disc Hunter — Card Generator</title>
<style>
  :root{
    --bg:#ECEFE6; --panel:#F7F8F2; --ink:#1F241C; --ink-soft:#5A6353;
    --line:#C9CFBE; --accent:#A64B26; --accent-ink:#FFF6EF;
    --focus:#7A9A4E;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141712; --panel:#1C201A; --ink:#E8EAE0; --ink-soft:#9AA38E;
      --line:#333A2E; --accent:#D97B4A; --accent-ink:#1A120C;
      --focus:#8FAE52;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141712; --panel:#1C201A; --ink:#E8EAE0; --ink-soft:#9AA38E;
    --line:#333A2E; --accent:#D97B4A; --accent-ink:#1A120C;
    --focus:#8FAE52;
  }
  :root[data-theme="light"]{
    --bg:#ECEFE6; --panel:#F7F8F2; --ink:#1F241C; --ink-soft:#5A6353;
    --line:#C9CFBE; --accent:#A64B26; --accent-ink:#FFF6EF;
    --focus:#7A9A4E;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:28px 24px 64px}
  header.app{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  h1{
    margin:0;font-family:"Arial Narrow","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:700;font-size:30px;letter-spacing:.04em;text-transform:uppercase;
  }
  header.app p{margin:0;color:var(--ink-soft)}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:26px;align-items:start}
  @media (max-width:900px){.cols{grid-template-columns:1fr}}
  .stage{position:relative}
  canvas#card{width:100%;height:auto;display:block;border-radius:4px;cursor:grab;touch-action:none}
  canvas#card.dragging{cursor:grabbing}
  .hint{margin-top:8px;color:var(--ink-soft);font-size:13px}
  .rail{display:flex;flex-direction:column;gap:18px}
  fieldset{
    border:1px solid var(--line);border-radius:6px;background:var(--panel);
    padding:14px 16px 16px;margin:0;display:flex;flex-direction:column;gap:12px;
  }
  legend{
    font-family:"Arial Narrow","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);padding:0 6px;
  }
  label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-soft)}
  select,
  input[type=text],textarea,input[type=number]{
    font:inherit;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;
  }
  input:focus-visible,textarea:focus-visible,button:focus-visible,input[type=range]:focus-visible{
    outline:2px solid var(--focus);outline-offset:1px;
  }
  textarea{resize:vertical;min-height:110px;text-transform:none;letter-spacing:0}
  .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .nums input{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
  input[type=range]{width:100%;accent-color:var(--accent)}
  input[type=file]{font-size:13px;color:var(--ink-soft)}
  label.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer}
  label.chk input{accent-color:var(--accent)}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  button{
    font:inherit;font-weight:600;border:1px solid var(--line);border-radius:5px;
    padding:9px 16px;background:var(--panel);color:var(--ink);cursor:pointer;
  }
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button:hover{filter:brightness(1.06)}
</style>

<div class="wrap">
  <header class="app">
    <h1>Pond Disc Hunter — Card Generator</h1>
    <p>Drop in a rescue photo, fill the stats, download the card.</p>
  </header>

  <div class="cols">
    <div class="stage">
      <canvas id="card" width="2000" height="1600" aria-label="Disc card preview. Drag to reposition the photo."></canvas>
      <p class="hint">Drag the image to frame the disc. Exports 2000 × 1600 (landscape) or 1080 × 1920 vertical — the same card stacked, or a full-bleed video overlay.</p>
    </div>

    <div class="rail">
      <fieldset>
        <legend>Photo</legend>
        <label class="f">Disc photo
          <input type="file" id="photo" accept="image/*">
        </label>
        <label class="f">Zoom
          <input type="range" id="zoom" min="100" max="300" value="100">
        </label>
        <label class="f">Logo (optional PNG, replaces built-in)
          <input type="file" id="logo" accept="image/*">
        </label>
      </fieldset>

      <fieldset>
        <legend>Disc</legend>
        <label class="f">Recent finds
          <select id="finds"></select>
        </label>
        <label class="f">Disc name
          <input type="text" id="name" value="DISCRAFT MALTA" maxlength="40">
        </label>
        <div class="nums">
          <label class="f">Speed<input type="number" id="speed" value="5" step="0.5"></label>
          <label class="f">Glide<input type="number" id="glide" value="4" step="0.5"></label>
          <label class="f">Turn<input type="number" id="turn" value="1" step="0.5"></label>
          <label class="f">Fade<input type="number" id="fade" value="3" step="0.5"></label>
        </div>
        <label class="chk"><input type="checkbox" id="unknown"> No Name — no owner name on the back</label>
        <button type="button" id="womp">🎺 Sad trombone</button>
      </fieldset>

      <fieldset>
        <legend>Story</legend>
        <label class="f">Recovery blurb
          <textarea id="story">Pulled from the murk with its Paul McBeth stamp still sharp, this swirly purple Malta traded the pond floor for the fairway. An overstable midrange approach machine — point it at the pin, let the fade do the rest. Back in the rotation!</textarea>
        </label>
      </fieldset>

      <fieldset>
        <legend>Export</legend>
        <label class="f">Orientation
          <select id="orient">
            <option value="landscape">Landscape — 2000 × 1600</option>
            <option value="vertical">Vertical — 1080 × 1920 (same card, stacked)</option>
            <option value="fullbleed">Vertical full-bleed — 1080 × 1920 (video overlay)</option>
          </select>
        </label>
        <div class="btnrow">
          <button class="primary" id="download">Download PNG</button>
          <button id="reset">Reset fields</button>
        </div>
      </fieldset>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var cv = document.getElementById("card");
  var ctx = cv.getContext("2d");
  var W = cv.width, H = cv.height;
  function orient(){ return document.getElementById("orient").value; }
  function vert(){ return orient() !== "landscape"; }          // any 1080×1920 mode
  function fullBleed(){ return orient() === "fullbleed"; }     // photo fills the frame
  function photoH(){ return vert() && !fullBleed() ? 960 : H; } // photo band height in classic vertical
  // Vertical video safe zones (Reels / Shorts / TikTok UI): keep content off
  // the top ~140px, bottom ~270px, and right ~130px of the 1080×1920 frame.
  // Only the full-bleed overlay layout uses these.
  var VSAFE = { left:70, right:130, top:140, bottom:270 };
  var COND = '"Arial Narrow","Helvetica Neue Condensed","Helvetica Neue",Helvetica,Arial,sans-serif';

  var state = {
    img:null, logo:null, zoom:1, ox:0, oy:0,
  };
  var fields = ["name","speed","glide","turn","fade","story"];
  var els = {};
  fields.forEach(function(id){ els[id] = document.getElementById(id); });

  // Prefill for the current find. When a new disc is loaded here (new id),
  // it overrides whatever was saved from the previous session.
  // Every disc found so far. First entry is the newest — it's the default prefill.
  var FINDS = [
    { id:"shryke-halo-2026-07-04", name:"INNOVA SHRYKE",
      speed:13, glide:6, turn:-2, fade:2,
      story:"A Halo Star Shryke in sherbet pink and yellow, plucked dripping from the drink. Fitting rescue: the shryke is named for the shrike — the 'butcher bird' that impales its catch on thorns — but this one got caught instead. Max glide, easy distance, 13 speed of sunset-colored bomber. Back to the skies!" },
    { id:"dd1-sline-2026-07-04", name:"DISCMANIA DD1",
      speed:11, glide:6, turn:-1, fade:2,
      story:"A royal-blue S-Line DD1 from Discmania's Originals line, fished out with the shield crest still shining. The stamp literally prints its own flight numbers — 11, 6, -1, 2 — a smooth, workable distance driver and the DD3 Cloud Breaker's easier-throwing little brother. Logged, rinsed, reclaimed!" },
    { id:"enforcer-raptoreye-2026-07-04", name:"DYNAMIC DISCS ENFORCER",
      speed:12, glide:4, turn:0.5, fade:4,
      story:"The Raptor Eye Enforcer — Fuzion Orbit plastic with one giant reptilian eye that watched us wade the whole way in. A seriously overstable 12-speed built for headwinds and hard flex lines. We flipped it for an owner's name: nothing. No name, no number, no way home. Unclaimed cargo becomes salvage — the eye hunts for OUR bag now. Womp womp." },
    { id:"blade-metalflake-2026-07-03", name:"GATEWAY BLADE",
      speed:9, glide:5, turn:0, fade:3,
      story:"A teal Metal Flake Blade, glittering through the algae like sunken treasure. Gateway is famous for putters, but this 9-speed fairway blade proves they can cut through a fairway too — dead straight with a dependable 3-fade finish. The sparkle survived the swamp. Back in action!" },
    { id:"thunderbird-dye-2026-07-03", name:"INNOVA THUNDERBIRD",
      speed:9, glide:5, turn:0, fade:2,
      story:"Somebody loved this one — a full custom dye job in tie-dye greens, pinks, and blues, still glowing under the pond grime. The Thunderbird is the fairway driver Calvin Heimburg rides to victory, a point-and-shoot 9-speed that holds any line. Too pretty to stay sunk. Back in the bag!" },
    { id:"star-destroyer-white-2026-07-03", name:"INNOVA STAR DESTROYER",
      speed:12, glide:5, turn:-1, fade:3,
      story:"Wearing a full coat of pond camo, this white Star Destroyer surfaced with its robot stamp still fighting. The most iconic distance driver in the game — the same mold behind Philo Brathwaite's legendary 850-foot albatross 'Holy Shot.' A scrub and a rinse, and this bot is back on distance duty!" },
    { id:"boss-2026-07-03", name:"INNOVA PRO BOSS",
      speed:13, glide:5, turn:-1, fade:3,
      story:"Freed from the algae after who knows how many summers, this Pro Boss is the fastest thing to come out of the pond yet. The mold behind the world distance record — 1,108 feet — with 13 speed of grip-it-and-rip-it power, and Pro plastic only gets grippier with a little pond seasoning. Cleaned up and cleared for takeoff!" },
    { id:"malita-2026-07-03", name:"DISCRAFT MALITA",
      speed:5, glide:5, turn:-1, fade:1,
      story:"Pulled from the murk with its Paul McBeth stamp still sharp — and this is no ordinary find. The Malita is one of Discraft's newest McBeth releases, a glidey, slightly flippy midrange built for touch shots and threading wooded lines. Barely a year old and already pond-seasoned. Back in the rotation!" }
  ];
  var PREFILL = FINDS[0];
  var MYSTERY = {
    name: "NO NAME",
    story: "We flipped it over hoping for a name and number... nothing. No owner, no digits, no way home. Somewhere out there a disc golfer gave up on this one and never signed their work. Cue the sad trombone — unclaimed cargo becomes salvage. Finders keepers. Womp womp."
  };

  // ---------- persistence ----------
  function save(){
    try{
      var d = {};
      fields.forEach(function(id){ d[id]=els[id].value; });
      localStorage.setItem("pdh-card", JSON.stringify(d));
      localStorage.setItem("pdh-prefill-id", PREFILL.id);
    }catch(e){}
  }
  function applyPrefill(find){
    var src = find || PREFILL;
    fields.forEach(function(id){ els[id].value = src[id]; });
    var un=document.getElementById("unknown");
    if(un.checked){ un.checked=false; stash=null; }
  }

  // recent-finds dropdown
  var findsSel = document.getElementById("finds");
  FINDS.forEach(function(f,i){
    var o=document.createElement("option");
    o.value=i; o.textContent=f.name + (i===0 ? " (latest)" : "");
    findsSel.appendChild(o);
  });
  findsSel.addEventListener("change",function(){
    applyPrefill(FINDS[findsSel.value|0]); save(); draw();
  });
  function load(){
    try{
      if(localStorage.getItem("pdh-prefill-id") !== PREFILL.id){
        applyPrefill(); save(); return;
      }
      var d = JSON.parse(localStorage.getItem("pdh-card")||"null");
      if(d) fields.forEach(function(id){ if(d[id]!=null) els[id].value=d[id]; });
    }catch(e){ applyPrefill(); }
  }
  load();

  // ---------- placeholder pond ----------
  function drawPlaceholder(rh){
    var g = ctx.createLinearGradient(0,0,0,rh);
    g.addColorStop(0,"#3d4a2a"); g.addColorStop(.55,"#55663a"); g.addColorStop(1,"#2c3520");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,rh);
    // algae flecks
    var seed=7;
    function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
    for(var i=0;i<900;i++){
      ctx.fillStyle="rgba("+(120+rnd()*80|0)+","+(140+rnd()*60|0)+",60,"+(0.05+rnd()*0.15)+")";
      var r=1+rnd()*6;
      ctx.beginPath(); ctx.arc(rnd()*W,rnd()*rh,r,0,7); ctx.fill();
    }
    ctx.fillStyle="rgba(255,255,255,.55)";
    ctx.font="600 54px "+COND;
    ctx.textAlign="center";
    ctx.fillText("ADD A DISC PHOTO",vert()?W/2:620,fullBleed()?H*0.3:rh/2);
    ctx.textAlign="left";
  }

  // bottom gradient scrim the vertical overlay text sits on — the photo
  // stays full-bleed instead of being cut into a band
  function drawScrim(){
    var g=ctx.createLinearGradient(0,760,0,1230);
    g.addColorStop(0,"rgba(12,11,8,0)");
    g.addColorStop(1,"rgba(12,11,8,0.93)");
    ctx.fillStyle=g;
    ctx.fillRect(0,760,W,H-760);
  }

  // ---------- photo ----------
  function drawPhoto(){
    var rh=photoH();
    if(vert()){ ctx.fillStyle="#14120e"; ctx.fillRect(0,0,W,H); }
    if(!state.img){ drawPlaceholder(rh); if(fullBleed()) drawScrim(); return; }
    var img=state.img;
    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,W,rh); ctx.clip();
    var s=Math.max(W/img.width,rh/img.height)*state.zoom;
    var dw=img.width*s, dh=img.height*s;
    var x=(W-dw)/2+state.ox, y=(rh-dh)/2+state.oy;
    // clamp so the frame is always covered
    x=Math.min(0,Math.max(W-dw,x)); y=Math.min(0,Math.max(rh-dh,y));
    state.ox=x-(W-dw)/2; state.oy=y-(rh-dh)/2;
    ctx.drawImage(img,x,y,dw,dh);
    ctx.restore();
    if(fullBleed()) drawScrim();
  }

  // ---------- logo ----------
  function drawLogo(){
    var lx = 55, ly = fullBleed() ? VSAFE.top : 55;
    if(state.logo){
      var lw = fullBleed() ? 360 : 440, lh=lw*state.logo.height/state.logo.width;
      ctx.drawImage(state.logo,lx,ly-5,lw,lh);
      return;
    }
    ctx.save();
    ctx.translate(lx,ly);
    if(fullBleed()) ctx.scale(0.8,0.8);
    ctx.fillStyle="rgba(10,12,8,.85)";
    rr(0,0,470,88,6); ctx.fill();
    rr(0,98,470,60,6); ctx.fill();
    ctx.fillStyle="#fff";
    ctx.font="italic 700 78px "+COND;
    ctx.textAlign="center";
    ctx.fillText("P O N D",235,70);
    ctx.font="italic 700 44px "+COND;
    ctx.fillText("DISC HUNTER",235,145);
    ctx.textAlign="left";
    ctx.restore();
  }

  // ---------- helpers ----------
  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function wrapText(text,maxW,font){
    ctx.font=font;
    var words=text.split(/\s+/), lines=[], cur="";
    words.forEach(function(w){
      var t=cur?cur+" "+w:w;
      if(ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=w; }
      else cur=t;
    });
    if(cur) lines.push(cur);
    return lines;
  }
  function fmt(v){
    var n=parseFloat(v);
    if(isNaN(n)) return "–";
    return n%1===0 ? n.toFixed(0) : n.toString();
  }

  // ---------- arrows ----------
  function arrow(cx, baseY, topY, curve, color){
    var g=ctx.createLinearGradient(0,baseY,0,topY);
    g.addColorStop(0,"rgba(120,120,120,0)");
    g.addColorStop(.45,color+"99");
    g.addColorStop(1,color);
    ctx.strokeStyle=g;
    ctx.lineWidth=30;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(cx,baseY);
    ctx.quadraticCurveTo(cx, (baseY+topY)/2, cx+curve, topY+40);
    ctx.stroke();
    // head
    var ang=Math.atan2((topY+40)-((baseY+topY)/2), curve*0.9) ;
    ctx.fillStyle=color;
    ctx.save();
    ctx.translate(cx+curve,topY+40);
    ctx.rotate(ang+Math.PI/2);
    ctx.beginPath();
    ctx.moveTo(0,-52); ctx.lineTo(38,18); ctx.lineTo(-38,18);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // rubber-stamp verdict for discs with no owner name on the back.
  // Draws centered on (0,0); caller translates/rotates/scales.
  function drawNoNameStamp(g, color){
    color = color || "#AEB6BE";
    var w=1150, h=560;
    g.save();
    g.strokeStyle=color; g.fillStyle=color;
    g.lineWidth=16;
    g.strokeRect(-w/2,-h/2,w,h);
    g.lineWidth=5;
    g.strokeRect(-w/2+22,-h/2+22,w-44,h-44);
    g.textAlign="center";
    g.font="700 240px "+COND;
    g.fillText("NO NAME",0,-10);
    g.font="700 52px "+COND;
    g.fillText("NO OWNER  ·  NO NUMBER  ·  NO WAY HOME",0,90);
    g.font="700 64px "+COND;
    g.fillText("FINDERS KEEPERS — POND LAW",0,190);
    // rubber-stamp grunge: punch speckles out of the ink
    g.globalCompositeOperation="destination-out";
    var seed=42;
    function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
    for(var i=0;i<420;i++){
      var rx=(rnd()-0.5)*w, ry=(rnd()-0.5)*h, rr2=1+rnd()*9;
      g.globalAlpha=0.4+rnd()*0.6;
      g.beginPath(); g.arc(rx,ry,rr2,0,7); g.fill();
    }
    g.restore();
  }
  try{
    window.renderNoNameStamp = function(color){
      var c=document.createElement("canvas");
      c.width=1500; c.height=900;
      var g=c.getContext("2d");
      g.translate(750,450); g.rotate(-0.14);
      drawNoNameStamp(g,color);
      return c.toDataURL("image/png");
    };
  }catch(e){}

  // wilted arrow for mystery mode — rises, gives up, droops.
  // s scales the droop so it fits the shorter vertical-slide arrow zone.
  function wiltedArrow(cx, baseY, topY, dir, color, s){
    s = s || 1;
    var g=ctx.createLinearGradient(0,baseY,0,topY);
    g.addColorStop(0,"rgba(120,120,120,0)");
    g.addColorStop(.5,color+"aa");
    g.addColorStop(1,color);
    ctx.strokeStyle=g;
    ctx.lineWidth=30;
    ctx.lineCap="round";
    var peakY=topY+70*s, dropX=cx+dir*95*s, dropY=peakY+150*s;
    ctx.beginPath();
    ctx.moveTo(cx,baseY);
    ctx.bezierCurveTo(cx,peakY+60*s, cx+dir*20*s,peakY, cx+dir*70*s,peakY+10*s);
    ctx.bezierCurveTo(dropX+dir*20*s,peakY+40*s, dropX,dropY-70*s, dropX,dropY);
    ctx.stroke();
    ctx.fillStyle=color;
    ctx.save();
    ctx.translate(dropX,dropY);
    ctx.scale(s,s);
    ctx.beginPath();
    ctx.moveTo(0,52); ctx.lineTo(38,-18); ctx.lineTo(-38,-18);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ---------- panel ----------
  // Landscape: boxed panel on the right. Classic vertical: the same card,
  // photo band on top and the same boxed panel below it.
  function drawPanel(){
    if(fullBleed()){ drawPanelVert(); return; }
    var V=vert();
    var px = V ? 40 : 1272,
        pw = V ? W-80 : 678,
        py = V ? photoH()-20 : 42,
        ph = V ? H-photoH()-20 : H-84;
    ctx.fillStyle="rgba(24,22,17,"+(V?0.96:0.84)+")";
    rr(px,py,pw,ph,10); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.14)";
    ctx.lineWidth=2; rr(px+10,py+10,pw-20,ph-20,8); ctx.stroke();

    var cx=px+pw/2;
    ctx.textAlign="center";

    var unknown = document.getElementById("unknown").checked;

    // heading
    ctx.fillStyle = unknown ? "#9BA3AB" : "#E8956B";
    ctx.font="700 "+(V?70:84)+"px "+COND;
    ctx.fillText("DISC FOUND:",cx,py+(V?90:130));
    ctx.fillStyle="#F2EEE6";
    var name=((unknown ? (els.name.value||MYSTERY.name) : els.name.value)||"UNKNOWN DISC").toUpperCase();
    // shrink to fit the panel
    var nameSize=V?48:62;
    ctx.font="700 "+nameSize+"px "+COND;
    while(ctx.measureText(name).width>pw-70 && nameSize>30){
      nameSize-=2;
      ctx.font="700 "+nameSize+"px "+COND;
    }
    ctx.fillText(name,cx,py+(V?152:210));

    // flight numbers box
    var fy=py+(V?190:270), boxH=V?165:190;
    ctx.strokeStyle="rgba(255,255,255,.25)";
    ctx.lineWidth=2;
    ctx.strokeRect(px+45,fy,pw-90,boxH);
    ctx.fillStyle="#C7BDB0";
    ctx.font="700 "+(V?34:40)+"px "+COND;
    ctx.fillText("FLIGHT NUMBERS",cx,fy+(V?46:52));
    var labels=["SPEED","GLIDE","TURN","FADE"];
    var vals = unknown ? ["?","?","?","?"]
      : [els.speed.value,els.glide.value,els.turn.value,els.fade.value].map(fmt);
    var colW=(pw-90)/4;
    for(var i=0;i<4;i++){
      var lx=px+45+colW*i+colW/2;
      ctx.fillStyle="#C7BDB0";
      ctx.font="700 "+(V?30:34)+"px "+COND;
      ctx.fillText(labels[i],lx,fy+(V?92:105));
      ctx.fillStyle="#FFFFFF";
      ctx.font="700 "+(V?52:64)+"px "+COND;
      ctx.fillText(vals[i],lx,fy+(V?148:172));
      if(i<3){
        ctx.strokeStyle="rgba(255,255,255,.18)";
        ctx.beginPath();
        ctx.moveTo(px+45+colW*(i+1),fy+(V?60:72));
        ctx.lineTo(px+45+colW*(i+1),fy+(V?150:180));
        ctx.stroke();
      }
    }

    // arrows section
    var ay=fy+boxH+(V?62:60);
    ctx.fillStyle="#C7BDB0";
    ctx.font="700 "+(V?36:42)+"px "+COND;
    var arrowTop=ay+(V?36:50), arrowBase=ay+(V?250:470);
    if(unknown){
      ctx.fillText("TURN: ?",px+pw*0.28,ay);
      ctx.fillText("FADE: ?",px+pw*0.72,ay);
      wiltedArrow(px+pw*0.28,arrowBase,arrowTop,-1,"#9BA3AB",V?0.6:1);
      wiltedArrow(px+pw*0.72,arrowBase,arrowTop, 1,"#9BA3AB",V?0.6:1);
    }else{
      var t=parseFloat(els.turn.value)||0, f=parseFloat(els.fade.value)||0;
      ctx.fillText("TURN: "+fmt(els.turn.value),px+pw*0.28,ay);
      ctx.fillText("FADE: "+fmt(els.fade.value),px+pw*0.72,ay);
      // RHBH flight: negative turn drifts right, fade hooks left
      arrow(px+pw*0.28,arrowBase,arrowTop, -t*(V?26:38), "#8FBF4D");
      arrow(px+pw*0.72,arrowBase,arrowTop, -f*(V?18:26), "#D9442B");
    }

    // story — auto-shrink until it fits between the arrows and the panel bottom
    var story=els.story.value||"";
    var maxTop=arrowBase+(V?52:90);
    var bottomPad=V?34:40;
    var sizes=V?[31,29,27,25,23]:[33,31,29,27];
    var font,lines,lh,sy;
    for(var si=0;si<sizes.length;si++){
      font="400 "+sizes[si]+"px "+COND;
      lh=sizes[si]+(V?9:11);
      lines=wrapText(story,pw-90,font);
      sy=py+ph-bottomPad-(lines.length-1)*lh;
      if(sy>=maxTop) break;
    }
    if(sy<maxTop) sy=maxTop;
    ctx.fillStyle="#EDE8DF";
    ctx.font=font;
    lines.forEach(function(l,i){
      var yy=sy+i*lh;
      if(yy<py+ph-16) ctx.fillText(l,cx,yy);
    });
    ctx.textAlign="left";
  }

  // ---------- vertical video slide (1080×1920) ----------
  // Full-bleed photo with the card content overlaid on the bottom scrim.
  // Everything stays inside VSAFE so Reels/Shorts/TikTok captions and the
  // right-hand button rail don't cover it.
  function drawPanelVert(){
    var px=VSAFE.left, pw=W-VSAFE.left-VSAFE.right, cx=px+pw/2;
    var bottomLim=H-VSAFE.bottom;
    var unknown = document.getElementById("unknown").checked;
    ctx.textAlign="center";

    // heading
    ctx.fillStyle = unknown ? "#9BA3AB" : "#E8956B";
    ctx.font="700 82px "+COND;
    ctx.fillText("DISC FOUND:",cx,940);
    ctx.fillStyle="#F2EEE6";
    var name=((unknown ? (els.name.value||MYSTERY.name) : els.name.value)||"UNKNOWN DISC").toUpperCase();
    var nameSize=60;
    ctx.font="700 "+nameSize+"px "+COND;
    while(ctx.measureText(name).width>pw-20 && nameSize>32){
      nameSize-=2;
      ctx.font="700 "+nameSize+"px "+COND;
    }
    ctx.fillText(name,cx,1020);

    // flight numbers box
    var fy=1062, boxH=168;
    ctx.strokeStyle="rgba(255,255,255,.3)";
    ctx.lineWidth=2;
    ctx.strokeRect(px,fy,pw,boxH);
    ctx.fillStyle="#C7BDB0";
    ctx.font="700 36px "+COND;
    ctx.fillText("FLIGHT NUMBERS",cx,fy+48);
    var labels=["SPEED","GLIDE","TURN","FADE"];
    var vals = unknown ? ["?","?","?","?"]
      : [els.speed.value,els.glide.value,els.turn.value,els.fade.value].map(fmt);
    var colW=pw/4;
    for(var i=0;i<4;i++){
      var lx=px+colW*i+colW/2;
      ctx.fillStyle="#C7BDB0";
      ctx.font="700 32px "+COND;
      ctx.fillText(labels[i],lx,fy+94);
      ctx.fillStyle="#FFFFFF";
      ctx.font="700 58px "+COND;
      ctx.fillText(vals[i],lx,fy+152);
      if(i<3){
        ctx.strokeStyle="rgba(255,255,255,.18)";
        ctx.beginPath();
        ctx.moveTo(px+colW*(i+1),fy+62);
        ctx.lineTo(px+colW*(i+1),fy+156);
        ctx.stroke();
      }
    }

    // arrows — compact, side by side
    var ay=1296, arrowTop=1326, arrowBase=1462;
    ctx.fillStyle="#C7BDB0";
    ctx.font="700 36px "+COND;
    if(unknown){
      ctx.fillText("TURN: ?",px+pw*0.28,ay);
      ctx.fillText("FADE: ?",px+pw*0.72,ay);
      wiltedArrow(px+pw*0.28,arrowBase,arrowTop,-1,"#9BA3AB",0.6);
      wiltedArrow(px+pw*0.72,arrowBase,arrowTop, 1,"#9BA3AB",0.6);
    }else{
      var t=parseFloat(els.turn.value)||0, f=parseFloat(els.fade.value)||0;
      ctx.fillText("TURN: "+fmt(els.turn.value),px+pw*0.28,ay);
      ctx.fillText("FADE: "+fmt(els.fade.value),px+pw*0.72,ay);
      // RHBH flight: negative turn drifts right, fade hooks left
      arrow(px+pw*0.28,arrowBase,arrowTop, -t*24, "#8FBF4D");
      arrow(px+pw*0.72,arrowBase,arrowTop, -f*17, "#D9442B");
    }

    // story — auto-shrink to fit above the caption safe zone
    var story=els.story.value||"";
    var maxTop=arrowBase+94;
    var sizes=[30,28,26,24,22,20];
    var font,lines,lh,sy;
    for(var si=0;si<sizes.length;si++){
      font="400 "+sizes[si]+"px "+COND;
      lh=sizes[si]+8;
      lines=wrapText(story,pw-20,font);
      sy=bottomLim-(lines.length-1)*lh;
      if(sy>=maxTop) break;
    }
    if(sy<maxTop) sy=maxTop;
    ctx.fillStyle="#EDE8DF";
    ctx.font=font;
    lines.forEach(function(l,i){
      var yy=sy+i*lh;
      if(yy<bottomLim+30) ctx.fillText(l,cx,yy);
    });
    ctx.textAlign="left";
  }

  function draw(){
    var wantW=vert()?1080:2000, wantH=vert()?1920:1600;
    if(cv.width!==wantW){ cv.width=wantW; cv.height=wantH; }
    W=cv.width; H=cv.height;
    ctx.clearRect(0,0,W,H);
    drawPhoto();
    if(document.getElementById("unknown").checked){
      ctx.save();
      if(fullBleed()){ ctx.translate(W/2,560); ctx.scale(0.68,0.68); }
      else if(vert()){ ctx.translate(W/2,photoH()*0.52); ctx.scale(0.78,0.78); }
      else ctx.translate(636,H*0.56);
      ctx.rotate(-0.14);
      ctx.globalAlpha=0.88;
      drawNoNameStamp(ctx,"#D8DEE4");
      ctx.restore();
    }
    drawPanel();
    drawLogo();
  }
  document.getElementById("orient").addEventListener("change",function(){
    try{ localStorage.setItem("pdh-orient",document.getElementById("orient").value); }catch(e){}
    state.ox=0; state.oy=0;
    draw();
  });
  try{
    var savedOrient=localStorage.getItem("pdh-orient");
    if(savedOrient) document.getElementById("orient").value=savedOrient;
  }catch(e){}

  // ---------- inputs ----------
  fields.forEach(function(id){
    els[id].addEventListener("input",function(){ save(); draw(); });
  });
  document.getElementById("zoom").addEventListener("input",function(e){
    state.zoom=e.target.value/100; draw();
  });
  function fileToImg(input,cb){
    input.addEventListener("change",function(){
      var f=input.files && input.files[0];
      if(!f) return;
      var url=URL.createObjectURL(f);
      var img=new Image();
      img.onload=function(){ cb(img); URL.revokeObjectURL(url); draw(); };
      img.src=url;
    });
  }
  fileToImg(document.getElementById("photo"),function(img){
    state.img=img; state.ox=0; state.oy=0;
  });
  fileToImg(document.getElementById("logo"),function(img){ state.logo=img; });

  // mystery mode
  var stash=null;
  document.getElementById("unknown").addEventListener("change",function(e){
    if(e.target.checked){
      stash={name:els.name.value,story:els.story.value};
      els.name.value=MYSTERY.name;
      els.story.value=MYSTERY.story;
      sadTrombone();
    }else if(stash){
      els.name.value=stash.name; els.story.value=stash.story; stash=null;
    }
    save(); draw();
  });

  // sad trombone — womp womp womp womaaaaah
  var audioCtx=null;
  function sadTrombone(){
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      var ac=audioCtx, t0=ac.currentTime+0.05;
      var notes=[
        {f:233.08,d:0.42},{f:220.00,d:0.42},{f:207.65,d:0.42},{f:196.00,d:1.6,droop:true}
      ];
      var t=t0;
      notes.forEach(function(n){
        var osc=ac.createOscillator(), gain=ac.createGain(), filt=ac.createBiquadFilter();
        osc.type="sawtooth";
        filt.type="lowpass"; filt.frequency.value=900; filt.Q.value=2;
        osc.frequency.setValueAtTime(n.f,t);
        if(n.droop){
          osc.frequency.setValueAtTime(n.f,t+0.25);
          osc.frequency.exponentialRampToValueAtTime(n.f*0.82,t+n.d);
          var lfo=ac.createOscillator(), lfoG=ac.createGain();
          lfo.frequency.value=5.5; lfoG.gain.value=6;
          lfo.connect(lfoG); lfoG.connect(osc.frequency);
          lfo.start(t); lfo.stop(t+n.d);
        }
        gain.gain.setValueAtTime(0.0001,t);
        gain.gain.exponentialRampToValueAtTime(0.35,t+0.06);
        gain.gain.setValueAtTime(0.35,t+n.d-(n.droop?0.9:0.12));
        gain.gain.exponentialRampToValueAtTime(0.0001,t+n.d);
        osc.connect(filt); filt.connect(gain); gain.connect(ac.destination);
        osc.start(t); osc.stop(t+n.d+0.05);
        t+=n.d+(n.droop?0:0.05);
      });
    }catch(e){}
  }
  document.getElementById("womp").addEventListener("click",sadTrombone);

  // drag to pan
  var drag=null;
  cv.addEventListener("pointerdown",function(e){
    if(!state.img) return;
    drag={x:e.clientX,y:e.clientY,ox:state.ox,oy:state.oy};
    cv.classList.add("dragging");
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove",function(e){
    if(!drag) return;
    var scale=W/cv.getBoundingClientRect().width;
    state.ox=drag.ox+(e.clientX-drag.x)*scale;
    state.oy=drag.oy+(e.clientY-drag.y)*scale;
    draw();
  });
  ["pointerup","pointercancel"].forEach(function(ev){
    cv.addEventListener(ev,function(){ drag=null; cv.classList.remove("dragging"); });
  });

  // export
  document.getElementById("download").addEventListener("click",function(){
    var name=(els.name.value||"disc").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    cv.toBlob(function(b){
      var a=document.createElement("a");
      a.href=URL.createObjectURL(b);
      a.download="pond-disc-hunter-"+(name||"card")+".png";
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); },5000);
    },"image/png");
  });

  document.getElementById("reset").addEventListener("click",function(){
    try{ localStorage.removeItem("pdh-card"); }catch(e){}
    applyPrefill();
    save(); draw();
  });

  draw();
})();
</script>
</html>
